services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configurez .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configurez .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurez .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEDIA_ROOT: /app/private-media
    volumes:
      - company_media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "manage.py", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  company_media:
